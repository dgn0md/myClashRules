name: Sync script and generate config

on:
  schedule:
    - cron: '17 18 * * *'
  push:
    branches:
      - main
    paths:
      - Script/mihomoScript.js
      - Config/mihomoConfig.yaml
      - tools/build.js
      - package.json
      - package-lock.json
      - .github/workflows/sync-config.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm

      - run: npm ci

      - name: Generate static config from the script
        run: npm run build

      - name: Verify generated config is reproducible
        run: npm run check

      - name: Commit generated config when it changes
        run: |
          set -euo pipefail
          if git diff --quiet -- Config/mihomoConfig.yaml; then
            echo 'Generated config is already up to date.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Config/mihomoConfig.yaml
          git commit -m 'chore: regenerate static config'
          git push
