name: Verify jsDelivr script CDN

on:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches:
      - main
    paths:
      - Script/mihomoScript.cdn.js
  workflow_dispatch:
  workflow_run:
    workflows:
      - Sync script and generate config
    branches:
      - main
    types:
      - completed

permissions: {}

concurrency:
  group: refresh-mainland-cdn
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare CDN script with source commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo "::error::Run this workflow on main so the CDN and source revision refer to the same branch."
            exit 1
          fi

          main_commit_info="$(curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main")"
          main_commit_sha="$(jq -r '.sha // empty' <<< "$main_commit_info")"
          if [[ -z "$main_commit_sha" ]]; then
            echo "::error::Could not determine the current main commit."
            exit 1
          fi

          source_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${main_commit_sha}/Script/mihomoScript.cdn.js"
          cdn_url="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/Script/mihomoScript.cdn.js"
          expected="$(mktemp)"
          response="$(mktemp)"
          trap 'rm -f "$expected" "$response"' EXIT

          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            "$source_url" --output "$expected"
          test -s "$expected"
          grep -qF 'function main(config)' "$expected"
          grep -qF 'CDN 对应源脚本 SHA-256：' "$expected"
          expected_sha="$(sha256sum "$expected" | cut -d ' ' -f 1)"

          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --header 'Cache-Control: no-cache' \
            "$cdn_url" --output "$response"
          test -s "$response"
          if cmp -s "$expected" "$response"; then
            echo "CDN content matches source commit ${main_commit_sha} (sha256: ${expected_sha})."
            exit 0
          fi

          actual_sha="$(sha256sum "$response" | cut -d ' ' -f 1)"
          script_commits_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits?path=Script%2FmihomoScript.cdn.js&sha=${main_commit_sha}&per_page=1"
          script_commit_info="$(curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 "$script_commits_url")"
          script_commit_sha="$(jq -r '.[0].sha // empty' <<< "$script_commit_info")"
          script_commit_date="$(jq -r '.[0].commit.committer.date // empty' <<< "$script_commit_info")"
          if [[ -z "$script_commit_sha" || -z "$script_commit_date" ]]; then
            echo "::error::Could not determine the latest script commit date."
            exit 1
          fi

          script_commit_epoch="$(date -u --date="$script_commit_date" +%s)"
          now_epoch="$(date -u +%s)"
          script_age_seconds=$((now_epoch - script_commit_epoch))
          max_branch_cache_age_seconds=45000
          if (( script_age_seconds < 0 )); then
            script_age_seconds=0
          fi

          if (( script_age_seconds < max_branch_cache_age_seconds )); then
            echo "::warning::CDN branch alias is still cached from an older script (CDN sha256: ${actual_sha}; latest script commit: ${script_commit_sha}; age: ${script_age_seconds}s). Scheduled runs will check again after the branch-alias cache window."
            exit 0
          fi

          echo "::error::CDN content is still stale after the branch-alias cache window (CDN sha256: ${actual_sha}; latest script commit: ${script_commit_sha}; age: ${script_age_seconds}s; source sha256: ${expected_sha})."
          exit 1
