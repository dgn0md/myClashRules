sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
proxy-providers:
  # 填入 Clash/Mihomo 订阅 URL；静态 provider 模式不能读取机场的顶层 DNS/hosts。
  订阅:
    type: http
    url: https://example.invalid/replace-with-your-subscription
    path: ./proxy_provider/subscription.yaml
    interval: 86400
    proxy: DIRECT
    exclude-type: DIRECT|REJECT|REMATCH
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 600
      lazy: true
    override:
      proxy-name:
        - pattern: (?i)🇨🇳(.*(台湾|台北|高雄|\b(TW|TWN)\b|taiwan))
          target: $1
        - pattern: (?i)((台湾|台北|高雄|\b(TW|TWN)\b|taiwan).*)🇨🇳
          target: $1
